# Local run convenience for the full vllm-calc stack (backend + frontend).
#   docker compose -f docker/docker-compose.yml up --build
# or simply:
#   make docker-up
#
# Then open the SPA at http://localhost:5173 (nginx proxies /v1/* to the backend,
# so it's a single origin — no CORS needed). The API is also exposed directly on
# http://localhost:8350 for the CLI (`vllm-calc check --api-url http://localhost:8350 ...`).

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vllm-calc-backend
    ports:
      - "8350:8000"
    environment:
      # All optional — uncomment to configure. The core calculation needs none of them.
      # RATE_LIMIT_ENABLED: "1"
      # RATE_LIMIT_PER_MINUTE: "120"
      # VLLM_VERSION_RANGE: ">=0.13,<0.14"       # override the reported calibrated range
      PORT: "8000"
    # No external network is required at runtime (air-gapped-capable).

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: vllm-calc-web
    ports:
      - "5173:80"
    depends_on:
      # Wait for the backend's /v1/health check (defined in docker/Dockerfile) so
      # the proxied SPA has a live API on first load.
      backend:
        condition: service_healthy
