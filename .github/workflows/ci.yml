name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install workspace (locked)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy)
        run: uv run mypy .
      - name: Test (pytest)
        run: uv run pytest
      - name: Validate presets (schema + provenance)
        run: uv run python -m vllm_calc_api.preset_validation

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Preset schema validation is added in Story 4.1; the GPU accuracy harness
  # (validation-gpu.yml) is a separate, self-hosted, scheduled workflow (Epic 4).
