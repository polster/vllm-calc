# Accuracy validation matrix — GPU × model × quant × TP cases against a pinned vLLM.
# Inputs are full engine CalcInput specs (arch inlined) so the harness needs only the
# engine. Run on the self-hosted GPU runner: vllm-calc-validate.
vllm_version: "0.13.0"

cases:
  - label: "llama-3.1-8b fp16 · 1×A100-80 · 8k/16"
    input:
      model_ref: meta-llama/Llama-3.1-8B
      total_params: 8030000000
      layers: 32
      attention_heads: 32
      kv_heads: 8
      head_dim: 128
      hidden_size: 4096
      attention_type: standard
      weight_quant: fp16
      kv_dtype: fp16
      ctx_len: 8192
      max_seqs: 16
      tensor_parallel_size: 1
      gpu_count: 1
      gpu_vram_gib: 80
      gpu_memory_utilization: 0.9

  - label: "llama-3.3-70b awq · 2×A100-80 · 8k/32"
    input:
      model_ref: meta-llama/Llama-3.3-70B-Instruct
      total_params: 70600000000
      layers: 80
      attention_heads: 64
      kv_heads: 8
      head_dim: 128
      hidden_size: 8192
      attention_type: standard
      weight_quant: awq-4bit
      kv_dtype: fp16
      ctx_len: 8192
      max_seqs: 32
      tensor_parallel_size: 2
      gpu_count: 2
      gpu_vram_gib: 80
      gpu_memory_utilization: 0.9

  - label: "mixtral-8x7b fp16 · 2×H100-80 · 4k/16"
    input:
      model_ref: mistralai/Mixtral-8x7B-v0.1
      total_params: 46700000000
      layers: 32
      attention_heads: 32
      kv_heads: 8
      head_dim: 128
      hidden_size: 4096
      attention_type: standard
      weight_quant: fp16
      kv_dtype: fp16
      ctx_len: 4096
      max_seqs: 16
      tensor_parallel_size: 2
      gpu_count: 2
      gpu_vram_gib: 80
      gpu_memory_utilization: 0.9
