[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-calc-validation"
version = "0.0.0"
description = "GPU accuracy validation harness (dev/CI only; never shipped in the runtime image)."
requires-python = ">=3.13,<3.15"
dependencies = [
    "vllm-calc-engine",
    "pyyaml>=6",
]

[project.scripts]
vllm-calc-validate = "vllm_calc_validation.harness:main"

[tool.setuptools.packages.find]
where = ["src"]
