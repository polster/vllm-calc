[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-calc-api"
version = "0.0.0"
description = "FastAPI backend for vllm-calc; exposes the engine over /v1."
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "vllm-calc-engine",
    "fastapi~=0.139",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
