[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-calc-engine"
version = "0.0.0"
description = "Pure calculation engine for vllm-calc (VRAM sizing for vLLM)."
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
