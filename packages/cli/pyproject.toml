[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-calc-cli"
version = "0.0.0"
description = "Typer CLI for vllm-calc (thin client of the API)."
requires-python = ">=3.13,<3.15"
dependencies = [
    "vllm-calc-engine",
    "typer~=0.26",
    "httpx~=0.28",
]

[project.scripts]
vllm-calc = "vllm_calc_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
