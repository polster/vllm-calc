server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service. The browser only ever talks
    # to this origin, so the SPA needs no CORS config and no VITE_API_BASE_URL.
    # `backend` resolves via the docker-compose network.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
